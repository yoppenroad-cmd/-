<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爆速ランチ決定くん</title>
    <style>
        :root { --primary: #ff4757; --secondary: #2f3542; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f1f2f6; margin: 0; padding: 20px; color: var(--secondary); }
        .container { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; margin-bottom: 20px; color: var(--primary); text-align: center; }
        .label { font-size: 14px; font-weight: bold; margin-bottom: 8px; display: block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        button { padding: 12px; border: 2px solid #ddd; border-radius: 12px; background: white; cursor: pointer; font-size: 15px; transition: 0.3s; }
        button.active { background: var(--primary); color: white; border-color: var(--primary); }
        select { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #ddd; margin-bottom: 20px; font-size: 16px; }
        .search-btn { background: #ffa502; color: white; border: none; width: 100%; font-size: 18px; font-weight: bold; margin-top: 10px; box-shadow: 0 4px 0 #e67e22; }
        .search-btn:active { transform: translateY(2px); box-shadow: none; }
        
        #result { margin-top: 30px; display: none; text-align: left; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .shop-card { border: 1px solid #eee; border-radius: 15px; overflow: hidden; background: #fff; }
        .shop-img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .shop-details { padding: 15px; }
        .go-btn { display: block; text-align: center; background: #1e90ff; color: white; text-decoration: none; padding: 12px; border-radius: 10px; margin-top: 10px; font-weight: bold; }
        .loading { display: none; margin: 20px; font-style: italic; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍴 本日の運命ランチ</h1>
    
    <span class="label">気分はどっち？</span>
    <div class="grid">
        <button class="genre-btn active" onclick="setGenre('G004', this)">和食</button>
        <button class="genre-btn" onclick="setGenre('G005,G006', this)">洋食</button>
        <button class="genre-btn" onclick="setGenre('G007', this)">中華</button>
        <button class="genre-btn" onclick="setGenre('', this)">すべて</button>
    </div>

    <span class="label">予算はどれくらい？</span>
    <select id="budget">
        <option value="B001">1,000円以内</option>
        <option value="B002">2,000円以内</option>
        <option value="B003">3,000円以内</option>
    </select>

    <button class="search-btn" onclick="searchLunch()">今日のおすすめを検索！</button>
    
    <div id="loading" class="loading">近くのお店を探しています...</div>

    <div id="result">
        <div class="shop-card">
            <img id="shop-img" class="shop-img" src="" alt="店舗写真">
            <div class="shop-details">
                <span id="shop-genre" style="font-size: 12px; color: #ff4757; font-weight: bold;"></span>
                <h2 id="shop-name" style="margin: 5px 0; font-size: 18px;"></h2>
                <p id="shop-catch" style="font-size: 13px; color: #666; margin-bottom: 10px;"></p>
                <p id="shop-access" style="font-size: 12px; color: #888;"></p>
                <a id="shop-link" class="go-btn" target="_blank">クーポン・詳細を見る</a>
            </div>
        </div>
    </div>
</div>

<script>
    const API_KEY = '2c2a225f26bee69d';
    let currentGenre = 'G004'; // 初期値は和食

    function setGenre(code, btn) {
        document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentGenre = code;
    }

    function searchLunch() {
        if (!navigator.geolocation) {
            alert("お使いのブラウザは位置情報に対応していません");
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('result').style.display = 'none';

        navigator.geolocation.getCurrentPosition(position => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const budget = document.getElementById('budget').value;

            // リクルートAPIのプロキシ（CORS回避のためにJSONPを使用）
            const script = document.createElement('script');
            script.src = `https://webservice.recruit.co.jp/hotpepper/gourmet/v1/?key=${API_KEY}&lat=${lat}&lng=${lng}&range=3&genre=${currentGenre}&budget=${budget}&format=jsonp&callback=handleResponse`;
            document.body.appendChild(script);
        }, error => {
            alert("位置情報の取得に失敗しました。設定を確認してください。");
            document.getElementById('loading').style.display = 'none';
        });
    }

    function handleResponse(data) {
        document.getElementById('loading').style.display = 'none';
        const shops = data.results.shop;

        if (shops.length === 0) {
            alert("近くに条件に合うお店が見つかりませんでした...");
            return;
        }

        // ランダムに1件選出
        const shop = shops[Math.floor(Math.random() * shops.length)];

        document.getElementById('shop-name').innerText = shop.name;
        document.getElementById('shop-img').src = shop.photo.pc.l;
        document.getElementById('shop-genre').innerText = shop.genre.name;
        document.getElementById('shop-catch').innerText = shop.catch;
        document.getElementById('shop-access').innerText = "📍 " + shop.access;
        document.getElementById('shop-link').href = shop.urls.pc;
        
        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
